name: Publish course website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m unittest discover -s labs/01-relational-sql/workspace/tests -q
      - run: python -m unittest discover -s labs/02-partitioning-replication/workspace/tests -q
      - run: python -m unittest discover -s labs/03-dwh-etl/workspace/tests -q
      - run: python -m unittest discover -s labs/04-mapreduce/workspace/tests -q
      - run: python -m unittest discover -s labs/05-pagerank/workspace/tests -q
      - run: python -m unittest discover -s labs/06-tfidf/workspace/tests -q
      - run: for lab in 03-dwh-etl 04-mapreduce 05-pagerank 06-tfidf; do node --check "labs/$lab/workspace/app.js" || exit 1; done
      - run: node --test tests/test_lab01_join.cjs tests/test_lab02_partitions.cjs tests/test_learning_packs.cjs
      - run: node --test tests/test_lab02_months.cjs
      - run: node --test tests/test_lab01_window_frame.cjs tests/test_lab01_window_rank_lag.cjs
      - run: node --test tests/test_lab01_family_aggregate.cjs tests/test_lab01_family_ranking.cjs tests/test_lab01_family_navigation.cjs
      - run: node --test tests/test_lab01_null.cjs
      - run: node --test tests/test_lab04_mean.cjs
      - run: node --test tests/test_lab04_variance.cjs
      - run: node --test labs/02-partitioning-replication/workspace/tests/test_results_csv.cjs labs/06-tfidf/workspace/tests/test_csv_export.cjs
      - run: python scripts/build_site.py --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
