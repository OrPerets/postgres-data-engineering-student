name: Publish course website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m unittest discover -s labs/01-relational-sql/workspace/tests -q
      - run: python -m unittest discover -s labs/02-partitioning-replication/workspace/tests -q
      - run: node --test tests/test_lab01_join.cjs tests/test_lab02_partitions.cjs tests/test_learning_packs.cjs
      - run: python scripts/build_site.py --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
