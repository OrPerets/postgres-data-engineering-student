services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: studentpass
      POSTGRES_DB: tfidf_lab
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - tfidf_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d tfidf_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  tfidf_data:
