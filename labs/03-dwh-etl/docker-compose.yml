services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: studentpass
      POSTGRES_DB: dwh_etl_lab
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - dwh_etl_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d dwh_etl_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  dwh_etl_data:
