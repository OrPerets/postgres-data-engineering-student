services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: studentpass
      POSTGRES_DB: query_lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - query_lab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d query_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  query_lab_data:
