site_name: Data Engineering — Hands-on Laboratory Course
site_description: Workshops in SQL, PostgreSQL, data warehousing and distributed processing.
docs_dir: docs/gitbook
# The GitBook navigation and authoring notes are not student-facing pages.
exclude_docs: |
  /SUMMARY.md
  /BRAND_GUIDE.md
  /CONNECT_GITBOOK.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    primary: custom
    accent: custom

extra_css:
  - stylesheets/extra.css
  - stylesheets/lab01-join.css
  - stylesheets/lab01-quiz.css
  - stylesheets/lab02-explorer.css
  - stylesheets/lab02-quiz.css
  - stylesheets/lab06-pack.css
  - stylesheets/lab05-pack.css
  - stylesheets/lab04-pack.css
  - stylesheets/lab03-pack.css

extra_javascript:
  - javascripts/lab01-join.js
  - javascripts/lab01-quiz.js
  - javascripts/lab02-explorer.js
  - javascripts/lab02-quiz.js
  - javascripts/lab06-pack.js
  - javascripts/lab05-pack.js
  - javascripts/lab04-pack.js
  - javascripts/lab03-pack.js

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Getting Started:
      - Data Engineering: README.md
      - Environment Setup: getting-started.md
      - How to Work Through a Lab: how-to-learn.md
      - Course Map: course-map.md
  - Relational Data Engineering:
      - Lab 01 — Relational SQL & Query Optimization: labs/01-relational-sql.md
      - SQL practice & quiz: activities/lab01-learning-pack.md
      - Lab 02 — Partitioning & Replication: labs/02-partitions-replicas.md
      - Partitioning practice & quiz: activities/lab02-learning-pack.md
      - Lab 03 — Data Warehouse & ETL: labs/03-dwh-etl.md
      - Warehouse practice & quiz: activities/lab03-learning-pack.md
  - Distributed Data Processing:
      - Lab 04 — MapReduce: labs/04-mapreduce.md
      - MapReduce practice & quiz: activities/lab04-learning-pack.md
      - Lab 05 — PageRank: labs/05-pagerank.md
      - PageRank practice & quiz: activities/lab05-learning-pack.md
      - Lab 06 — Regex & TF-IDF: labs/06-tfidf.md
      - TF-IDF practice & quiz: activities/lab06-learning-pack.md
  - Resources:
      - Troubleshooting: troubleshooting.md
      - Glossary: glossary.md
